name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; never cancel one that has started.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Secrets live only in this environment: deploys from main only, each run approved by the owner.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Until infra/ has created the database and its ID is in wrangler.jsonc (infra/README.md).
      - name: Check the database ID is set
        run: |
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has the placeholder D1 database ID (infra/README.md, First deployment)"
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test before deploying
        run: pnpm test

      # Migrations run before the new code, so the code can rely on the schema. They must stay
      # backward compatible with the code currently live (add, never rename or drop in one step).
      - name: Apply D1 migrations, then deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # Uploaded with `wrangler secret bulk` before the commands below run.
          secrets: |
            STATE_ENCRYPTION_KEY
            SESSION_PEPPER
            CONTACT_TO
            OWNER_UID
          command: |
            d1 migrations apply DB --remote
            deploy
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          SESSION_PEPPER: ${{ secrets.SESSION_PEPPER }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          OWNER_UID: ${{ secrets.OWNER_UID }}

      # Ten minutes, so the first deployment can attach the custom domain meanwhile (infra/).
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 10 https://promptshare.cc/oauth/client.json | grep -q '"client_name":"Prompt share"'; then
              echo "healthy"; exit 0
            fi
            sleep 10
          done
          echo "::error::https://promptshare.cc did not become healthy"
          exit 1
